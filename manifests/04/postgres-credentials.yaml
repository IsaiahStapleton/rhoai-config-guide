---
# MaaS credentials — used by the PostgreSQL image to create the 'maasdb' database and 'maas' user.
apiVersion: v1
kind: Secret
metadata:
  name: maas-postgresql-credentials
  namespace: redhat-ods-applications
type: Opaque
stringData:
  POSTGRESQL_DATABASE: maasdb
  POSTGRESQL_USER: maas
  POSTGRESQL_PASSWORD: maasdb123
  POSTGRESQL_ADMIN_PASSWORD: adminpassword
---
# Registry credentials (redhat-ods-applications copy) — referenced by the init script.
apiVersion: v1
kind: Secret
metadata:
  name: registry-postgresql-credentials
  namespace: redhat-ods-applications
type: Opaque
stringData:
  POSTGRESQL_PASSWORD: "registry"
---
# Registry credentials (rhoai-model-registries copy) — the Model Registry operator reads
# the passwordSecret from the same namespace as the ModelRegistry CR.
apiVersion: v1
kind: Secret
metadata:
  name: registry-postgresql-credentials
  namespace: rhoai-model-registries
type: Opaque
stringData:
  POSTGRESQL_PASSWORD: "registry"
