apiVersion: modelregistry.opendatahub.io/v1beta1
kind: ModelRegistry
metadata:
  name: local-model-registry
  namespace: rhoai-model-registries
spec:
  postgres:
    # Cross-namespace connection: PostgreSQL runs in redhat-ods-applications,
    # the Model Registry CR lives in rhoai-model-registries.
    host: maas-postgresql.redhat-ods-applications.svc.cluster.local
    port: 5432
    database: registry
    username: registry
    passwordSecret:
      name: registry-postgresql-credentials
      key: POSTGRESQL_PASSWORD
    skipDBCreation: true
