apiVersion: v1
kind: Namespace
metadata:
  name: kuadrant-system
---
kind: OperatorGroup
apiVersion: operators.coreos.com/v1
metadata:
  name: kuadrant
  namespace: kuadrant-system
spec:
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhcl-operator
  namespace: kuadrant-system
spec:
  channel: stable
  installPlanApproval: Automatic
  name: rhcl-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
# After the operator is installed, enable the OCP web console plugin:
#
#   oc patch console.operator.openshift.io cluster --type=json \
#     -p '[{"op":"add","path":"/spec/plugins/-","value":"kuadrant-console-plugin"}]'
#
# This appends kuadrant-console-plugin to the existing plugins list without
# overwriting other enabled plugins (networking-console-plugin, monitoring-plugin).
