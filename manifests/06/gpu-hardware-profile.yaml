# NVidia GPU hardware profile for RHOAI workloads. This profile defines the resource requirements for running RHOAI workloads that require GPU acceleration. It specifies the number of CPU cores, amount of memory, and number of GPUs that can be requested by RHOAI workloads.
apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  name: gpu-profile
  namespace: redhat-ods-applications
spec:
  identifiers:
    - identifier: cpu
      displayName: CPU
      defaultCount: '1'
      minCount: 1
      maxCount: '8'
      resourceType: CPU
    - identifier: memory
      displayName: Memory
      defaultCount: 12Gi
      minCount: 1Gi
      maxCount: 16Gi
      resourceType: Memory
    - identifier: nvidia.com/gpu
      displayName: GPU
      defaultCount: 1
      minCount: 1
      maxCount: 4
      resourceType: Accelerator