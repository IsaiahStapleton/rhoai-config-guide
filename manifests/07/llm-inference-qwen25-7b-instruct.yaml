# NOTE: Qwen2.5-7B requires a GPU with at least 20 GiB VRAM (e.g. A100, H100).
# It exceeds the Tesla T4's 15 GiB VRAM. Use llm-inference-qwen25-3b-instruct.yaml for T4 clusters.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: redhataiqwen25-7b-instruct
  namespace: dybbol
  annotations:
    opendatahub.io/hardware-profile-name: gpu-profile
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    opendatahub.io/model-type: generative
    openshift.io/description: qwen 2.5
    openshift.io/display-name: RedHatAI/Qwen2.5-7B-Instruct
    security.opendatahub.io/enable-auth: "false"
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
spec:
  model:
    name: redhataiqwen25-7b-instruct
    uri: oci://registry.redhat.io/rhelai1/modelcar-qwen2-5-7b-instruct:1.5
  replicas: 1
  router:
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
    route: {}
    scheduler: {}
  template:
    containers:
    - name: main
      args:
        - --max-model-len=4096
        - --gpu-memory-utilization=0.95
        - --enable-auto-tool-choice
        - --tool-call-parser hermes
      resources:
        limits:
          cpu: "1"
          memory: 12Gi
          nvidia.com/gpu: "1"
        requests:
          cpu: "1"
          memory: 12Gi
          nvidia.com/gpu: "1"
